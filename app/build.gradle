// app/build.gradle - app 模块的构建配置
// 作用：定义 app 的所有依赖、SDK 版本、构建选项

plugins {
    id 'com.android.application'        // Android 应用插件
    id 'org.jetbrains.kotlin.android'   // Kotlin 插件
}

android {
    // 应用的命名空间（生成的 R 类的包名）
    namespace 'com.example.wagemanager'

    // 编译时用的 Android SDK 版本
    compileSdk 34

    defaultConfig {
        // 应用唯一标识（发布到应用商店时的 ID）
        applicationId "com.example.wagemanager"

        // 最低支持的 Android 版本（API 24 = Android 7.0）
        minSdk 24

        // 目标 Android 版本（API 34 = Android 14）
        targetSdk 34

        // 版本号
        versionCode 1
        versionName "1.0"
    }

    // 构建类型：debug（调试）和 release（发布）
    buildTypes {
        debug {
            // debug 包默认可以调试
            // 这里什么都不写，用默认配置
        }
        release {
            minifyEnabled false  // 不混淆代码（学习阶段先关闭）
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Java 编译选项
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Kotlin 编译选项
    kotlinOptions {
        jvmTarget = '17'
    }

    // 启用 Compose（新一代 UI 框架）
    buildFeatures {
        compose true
    }

    // Compose 编译器版本（必须与 Kotlin 版本对应）
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.3'
    }

    // 打包选项
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Android 核心库
    implementation 'androidx.core:core-ktx:1.12.0'

    // Lifecycle 库（管理 Activity 生命周期）
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    // Activity Compose 集成（用 Compose 写 Activity）
    implementation 'androidx.activity:activity-compose:1.8.1'

    // Compose BOM：统一管理 Compose 各组件版本
    implementation platform('androidx.compose:compose-bom:2023.10.01')

    // Compose 核心库
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'

    // Material Design 3（Google 设计规范）
    implementation 'androidx.compose.material3:material3'
}