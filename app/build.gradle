// app/build.gradle - app 模块的构建配置
// 作用：定义 app 的所有依赖、SDK 版本、构建选项

plugins {
    id 'com.android.application'        // Android 应用插件
    id 'org.jetbrains.kotlin.android'   // Kotlin 插件
    id 'com.google.devtools.ksp'        // Room 注解处理
}

android {
    // 应用的命名空间（生成的 R 类的包名）
    namespace 'com.example.wagemanager'

    // 编译时用的 Android SDK 版本
    compileSdk 34

    defaultConfig {
        // 应用唯一标识（发布到应用商店时的 ID）
        applicationId "com.example.wagemanager"

        // 最低支持的 Android 版本（API 24 = Android 7.0）
        minSdk 24

        // 目标 Android 版本（API 34 = Android 14）
        targetSdk 34

        // 版本号：M1 里程碑
        versionCode 2
        versionName "1.1.0-m1"
    }

    // 构建类型：debug（调试）和 release（发布）
    buildTypes {
        debug {
            // debug 包默认可以调试
            // 这里什么都不写，用默认配置
        }
        release {
            minifyEnabled false  // 不混淆代码（学习阶段先关闭）
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Java 编译选项
    compileOptions {
        // 启用核心库脱糖：让 minSdk 24 也能用 java.time API
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Kotlin 编译选项
    kotlinOptions {
        jvmTarget = '17'
    }

    // 启用 Compose（新一代 UI 框架）
    buildFeatures {
        compose true
    }

    // Compose 编译器版本（必须与 Kotlin 版本对应）
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }

    // 打包选项
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// Room 注解处理器配置：把 schema JSON 输出到项目里（用于版本迁移与 CI 校验）
ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
    arg('room.incremental', 'true')
}

dependencies {
    // Android 核心库
    implementation 'androidx.core:core-ktx:1.12.0'

    // Lifecycle 库（管理 Activity / ViewModel 生命周期）
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'

    // Activity Compose 集成（用 Compose 写 Activity）
    implementation 'androidx.activity:activity-compose:1.8.1'

    // Compose BOM：统一管理 Compose 各组件版本（M3.1 升级到 2024.06.00 → material3 1.2.1 stable，解锁 weekdays slot + selectDate()）
    implementation platform('androidx.compose:compose-bom:2024.06.00')

    // Compose 核心库
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'

    // Material Design 3（Google 设计规范）
    implementation 'androidx.compose.material3:material3'

    // Room 数据库（KSP 注解处理）
    def roomVersion = '2.6.1'
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    // Kotlin 协程（Room suspend 函数、ViewModel scope）
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // 核心库脱糖：让 minSdk 24 也能用 java.time API
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
