# GitHub Actions 工作流：自动构建 Android APK
#
# 触发时机：
#   1. 推送到 main 分支时
#   2. 创建/更新合并到 main 的 PR（合并前验证）
#   3. 手动在网页点击 "Run workflow"
#
# 流程：
#   装 JDK → 装 Gradle → 跑纯 Java 业务规则 javac 测试 → 编译 APK → 上传 APK + Room Schema 产物

name: Build Android APK

on:
  # 推送到 main 分支时触发
  push:
    branches: [ main ]
  # PR 合并前验证（防止坏代码合入 main）
  pull_request:
    branches: [ main ]
  # 允许手动触发（网页上点按钮跑）
  workflow_dispatch:

jobs:
  build:
    # 用 Ubuntu 最新版（云端免费）
    runs-on: ubuntu-latest

    steps:
      # ===== 步骤 1：下载代码 =====
      - name: 📥 检出代码
        uses: actions/checkout@v4

      # ===== 步骤 2：装 Java 17 =====
      - name: ☕ 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ===== 步骤 3：装 Gradle =====
      # 必须固定 Gradle 版本到 8.x，不能用默认最新（默认会下 9.x，跟我们的 AGP 8.1.4 不兼容）
      - name: 🔧 设置 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'  # 跟 AGP 8.2.2 匹配
          cache-disabled: false  # 启用缓存

      # ===== 步骤 4：测试纯 Java 业务规则 =====
      # 在 Android 编译前先用 javac 验证 util/*.java 的业务逻辑
      # 这步不需要 Android SDK，能快速反馈业务规则的回归
      # 用通配符匹配 util/*.java 避免每次加新类都要改 CI
      - name: 🧪 测试纯 Java 业务规则
        run: |
          OUT="$RUNNER_TEMP/wage-javac-test"
          mkdir -p "$OUT"
          javac -encoding UTF-8 -d "$OUT" \
            $(find app/src/main/java/com/example/wagemanager/util -name '*.java') \
            $(find app/src/testJavac -name '*.java')
          java -cp "$OUT" com.example.wagemanager.util.WageBusinessRulesJavacTest

      # ===== 步骤 5：接受 Android SDK 许可 =====
      # Android SDK 首次使用需要同意 license，否则构建会失败
      - name: 📜 接受 Android SDK 许可
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> $ANDROID_HOME/licenses/android-sdk-license

      # ===== 步骤 6：构建 Debug APK =====
      # 用 gradle 命令而不是 ./gradlew（避免仓库里没有 wrapper）
      - name: 🏗️ 构建 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # ===== 步骤 7：把 APK 上传为可下载的产物 =====
      - name: 📤 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          # 产物名字（在下载页面显示）
          name: app-debug
          # APK 路径（Gradle 生成的）
          path: app/build/outputs/apk/debug/app-debug.apk
          # 保留 30 天（之后自动删除）
          retention-days: 30

      # 注：Room Schema（app/schemas/*.json）会自动生成在仓库里（exportSchema = true）
      # 但当前阶段没做 Migration 测试，CI 不上传 schema 产物
      # 等到要做 MigrationTestHelper 时再加回

      # ===== 步骤 8：构建结果摘要 =====
      - name: 📋 打印构建结果
        if: success()
        run: |
          echo "================================="
          echo "🎉 构建成功！"
          echo "📦 产物：app-debug（APK）"
          echo "📥 在 Actions 页面下载 Artifacts"
          echo "================================="
